<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#080e1c"/>
    </linearGradient>

    <!-- Glowing Accents -->
    <radialGradient id="glowCyan" cx="80%" cy="25%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#00c6ff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowIndigo" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#4facfe" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141e33" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f1728" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Neon Accent Gradients -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="neonEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="neonAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Filter for glowing dropshadows -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; fill: #ffffff; }
      .sub-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #94a3b8; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1px; }
      .kpi-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
      .kpi-val { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 800; fill: #f8fafc; }
      .kpi-delta { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #10b981; }
      .mono-text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }

      @keyframes pulseRing {
        0% { r: 52px; opacity: 0.7; }
        50% { r: 64px; opacity: 0.2; }
        100% { r: 52px; opacity: 0.7; }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -40; }
      }
      .pulsing-ring { animation: pulseRing 3.5s ease-in-out infinite; }
      .dashed-path { stroke-dasharray: 6 4; animation: dashMove 2s linear infinite; }
    </style>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="480" fill="url(#bgGrad)"/>
  <rect width="1200" height="480" fill="url(#glowCyan)"/>
  <rect width="1200" height="480" fill="url(#glowIndigo)"/>

  <!-- Subtle Blueprint Grid Pattern -->
  <g stroke="#1e293b" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="120" y1="0" x2="120" y2="480"/>
    <line x1="240" y1="0" x2="240" y2="480"/>
    <line x1="360" y1="0" x2="360" y2="480"/>
    <line x1="480" y1="0" x2="480" y2="480"/>
    <line x1="600" y1="0" x2="600" y2="480"/>
    <line x1="720" y1="0" x2="720" y2="480"/>
    <line x1="840" y1="0" x2="840" y2="480"/>
    <line x1="960" y1="0" x2="960" y2="480"/>
    <line x1="1080" y1="0" x2="1080" y2="480"/>
  </g>

  <!-- Top Badges / Pills -->
  <g transform="translate(60, 48)">
    <!-- Badge 1: Fintech Intel -->
    <rect x="0" y="0" width="182" height="28" rx="14" fill="#0f172a" stroke="#00f2fe" stroke-width="1.2" stroke-opacity="0.8"/>
    <circle cx="16" cy="14" r="4" fill="#00f2fe" filter="url(#glowFilter)"/>
    <text x="28" y="18" fill="#38bdf8" class="badge-text">FINANCIAL ANALYTICS</text>

    <!-- Badge 2: SQL & ML -->
    <rect x="194" y="0" width="170" height="28" rx="14" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.2" stroke-opacity="0.8"/>
    <circle cx="210" cy="14" r="4" fill="#a855f7" filter="url(#glowFilter)"/>
    <text x="222" y="18" fill="#c084fc" class="badge-text">ADVANCED SQL &amp; ML</text>

    <!-- Badge 3: Customer RFM -->
    <rect x="376" y="0" width="168" height="28" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.8"/>
    <circle cx="392" cy="14" r="4" fill="#10b981" filter="url(#glowFilter)"/>
    <text x="404" y="18" fill="#34d399" class="badge-text">RFM SEGMENTATION</text>
  </g>

  <!-- Main Titles Left Column -->
  <g transform="translate(60, 125)">
    <text x="0" y="0" class="title-text" font-size="38" letter-spacing="-0.5px">
      Bank Customer Segmentation &amp;
    </text>
    <text x="0" y="44" class="title-text" font-size="38" letter-spacing="-0.5px" fill="url(#neonCyan)">
      Transaction Intelligence Suite
    </text>

    <!-- Description -->
    <text x="0" y="85" class="sub-text" font-size="15" font-weight="400">
      Enterprise financial data modeling, algorithmic RFM clustering, salary trend forensics,
    </text>
    <text x="0" y="107" class="sub-text" font-size="15" font-weight="400">
      and geospatial customer behavioral analytics across multi-tier retail banking portfolios.
    </text>

    <!-- Author & Stack Metadata Tag -->
    <g transform="translate(0, 130)">
      <rect x="0" y="0" width="460" height="34" rx="8" fill="#111c33" stroke="#253557" stroke-width="1"/>
      <path d="M16 12 L22 17 L16 22" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="32" y="22" class="mono-text" font-size="12" fill="#93c5fd" font-weight="600">
        Engineered by M Akshay Sharma · @akshaysharma2005
      </text>
      <circle cx="438" cy="17" r="4" fill="#10b981"/>
    </g>
  </g>

  <!-- 4 Interactive KPI Cards at Bottom Left -->
  <g transform="translate(60, 335)">
    <!-- Card 1: Total Volume -->
    <g>
      <rect width="128" height="92" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="128" y2="0" stroke="url(#neonCyan)" stroke-width="3" rx="1.5"/>
      <text x="14" y="28" class="kpi-title">Gross Volume</text>
      <text x="14" y="55" class="kpi-val">₦485.2M</text>
      <text x="14" y="76" class="kpi-delta">▲ +18.4% YoY</text>
    </g>

    <!-- Card 2: Customers -->
    <g transform="translate(142, 0)">
      <rect width="128" height="92" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="128" y2="0" stroke="url(#neonEmerald)" stroke-width="3" rx="1.5"/>
      <text x="14" y="28" class="kpi-title">Cust. Profiles</text>
      <text x="14" y="55" class="kpi-val">1,000+</text>
      <text x="14" y="76" class="kpi-delta" fill="#38bdf8">12 Top Cities</text>
    </g>

    <!-- Card 3: Segments -->
    <g transform="translate(284, 0)">
      <rect width="128" height="92" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="128" y2="0" stroke="url(#neonPurple)" stroke-width="3" rx="1.5"/>
      <text x="14" y="28" class="kpi-title">RFM Tiers</text>
      <text x="14" y="55" class="kpi-val">6 Classes</text>
      <text x="14" y="76" class="kpi-delta" fill="#c084fc">K-Means Clustered</text>
    </g>

    <!-- Card 4: Retention Index -->
    <g transform="translate(426, 0)">
      <rect width="128" height="92" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="128" y2="0" stroke="url(#neonAmber)" stroke-width="3" rx="1.5"/>
      <text x="14" y="28" class="kpi-title">Active Ratio</text>
      <text x="14" y="55" class="kpi-val">84.2%</text>
      <text x="14" y="76" class="kpi-delta" fill="#fbbf24">15.8% Dormant</text>
    </g>
  </g>

  <!-- RIGHT COLUMN: High-End Futuristic Banking Radar & Network Diagram -->
  <g transform="translate(710, 40)">
    <!-- Container Panel -->
    <rect width="430" height="390" rx="20" fill="#0c1424" fill-opacity="0.9" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="430" height="390" rx="20" fill="none" stroke="url(#neonCyan)" stroke-width="1" stroke-opacity="0.3"/>

    <!-- Panel Header -->
    <g transform="translate(25, 30)">
      <circle cx="6" cy="6" r="5" fill="#ef4444" opacity="0.8"/>
      <circle cx="22" cy="6" r="5" fill="#f59e0b" opacity="0.8"/>
      <circle cx="38" cy="6" r="5" fill="#10b981" opacity="0.8"/>
      <text x="60" y="10" class="mono-text" font-size="11" fill="#64748b">ANALYTICS ENGINE // RFM_TOPOLOGY_VIEW</text>
      <rect x="300" y="-3" width="75" height="18" rx="4" fill="#13233c"/>
      <text x="312" y="10" class="mono-text" font-size="10" fill="#00f2fe" font-weight="700">LIVE FEED</text>
    </g>

    <!-- Central Donut / Radar Graphic -->
    <g transform="translate(215, 185)">
      <!-- Pulsing Outer Ring -->
      <circle cx="0" cy="0" r="56" fill="none" stroke="#00f2fe" stroke-width="1.5" class="pulsing-ring" opacity="0.4"/>
      <circle cx="0" cy="0" r="88" fill="none" stroke="#253557" stroke-width="1" stroke-dasharray="4 4"/>
      <circle cx="0" cy="0" r="120" fill="none" stroke="#1a2744" stroke-width="1"/>

      <!-- Donut Segments (Simulated via SVG arc strokes) -->
      <!-- Segment 1: Champions (Cyan) 25% -->
      <circle cx="0" cy="0" r="70" fill="none" stroke="#00f2fe" stroke-width="16"
              stroke-dasharray="110 330" stroke-dashoffset="0" stroke-linecap="round"/>
      <!-- Segment 2: Loyal (Emerald) 30% -->
      <circle cx="0" cy="0" r="70" fill="none" stroke="#10b981" stroke-width="16"
              stroke-dasharray="132 308" stroke-dashoffset="-118" stroke-linecap="round"/>
      <!-- Segment 3: Potential (Purple) 20% -->
      <circle cx="0" cy="0" r="70" fill="none" stroke="#8b5cf6" stroke-width="16"
              stroke-dasharray="88 352" stroke-dashoffset="-258" stroke-linecap="round"/>
      <!-- Segment 4: At Risk & Dormant (Amber/Rose) 25% -->
      <circle cx="0" cy="0" r="70" fill="none" stroke="#f43f5e" stroke-width="16"
              stroke-dasharray="90 350" stroke-dashoffset="-354" stroke-linecap="round"/>

      <!-- Center Core Content -->
      <circle cx="0" cy="0" r="48" fill="#070d18" stroke="#1e293b" stroke-width="2"/>
      <text x="0" y="-8" text-anchor="middle" class="mono-text" font-size="10" fill="#64748b" font-weight="600">CLUSTER</text>
      <text x="0" y="14" text-anchor="middle" class="title-text" font-size="20" fill="#ffffff">K=6</text>
      <text x="0" y="28" text-anchor="middle" class="mono-text" font-size="9" fill="#10b981">OPTIMAL</text>

      <!-- Orbiting Nodes with dashed connections -->
      <!-- Node A: Champions -->
      <line x1="50" y1="-50" x2="110" y2="-90" stroke="#00f2fe" stroke-width="1.2" class="dashed-path"/>
      <g transform="translate(110, -90)">
        <circle cx="0" cy="0" r="7" fill="#00f2fe" filter="url(#glowFilter)"/>
        <circle cx="0" cy="0" r="3" fill="#ffffff"/>
        <text x="14" y="4" class="title-text" font-size="11" fill="#38bdf8">Champions (25%)</text>
      </g>

      <!-- Node B: Loyal -->
      <line x1="70" y1="20" x2="125" y2="40" stroke="#10b981" stroke-width="1.2" class="dashed-path"/>
      <g transform="translate(125, 40)">
        <circle cx="0" cy="0" r="7" fill="#10b981" filter="url(#glowFilter)"/>
        <circle cx="0" cy="0" r="3" fill="#ffffff"/>
        <text x="14" y="4" class="title-text" font-size="11" fill="#34d399">Loyalists (30%)</text>
      </g>

      <!-- Node C: Potential -->
      <line x1="-50" y1="50" x2="-100" y2="90" stroke="#8b5cf6" stroke-width="1.2" class="dashed-path"/>
      <g transform="translate(-100, 90)">
        <circle cx="0" cy="0" r="7" fill="#8b5cf6" filter="url(#glowFilter)"/>
        <circle cx="0" cy="0" r="3" fill="#ffffff"/>
        <text x="-14" y="4" text-anchor="end" class="title-text" font-size="11" fill="#c084fc">Potential (20%)</text>
      </g>

      <!-- Node D: At Risk -->
      <line x1="-60" y1="-40" x2="-115" y2="-75" stroke="#f43f5e" stroke-width="1.2" class="dashed-path"/>
      <g transform="translate(-115, -75)">
        <circle cx="0" cy="0" r="7" fill="#f43f5e" filter="url(#glowFilter)"/>
        <circle cx="0" cy="0" r="3" fill="#ffffff"/>
        <text x="-14" y="4" text-anchor="end" class="title-text" font-size="11" fill="#fb7185">At Risk / Dormant</text>
      </g>
    </g>

    <!-- Bottom Status Bar inside Panel -->
    <g transform="translate(25, 332)">
      <rect width="380" height="38" rx="8" fill="#101a2e" stroke="#1e2c47" stroke-width="1"/>
      <circle cx="20" cy="19" r="4" fill="#00f2fe"/>
      <text x="34" y="23" class="mono-text" font-size="11" fill="#94a3b8">SQL CTE Engine: <tspan fill="#38bdf8">14 queries active</tspan> · Latency &lt; 8ms</text>
      <rect x="315" y="9" width="52" height="20" rx="4" fill="#065f46"/>
      <text x="325" y="23" class="mono-text" font-size="10" fill="#34d399" font-weight="700">PASS</text>
    </g>
  </g>
</svg>
